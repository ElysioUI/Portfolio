<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.resume | default: site.description }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body><canvas id="reseau" aria-hidden="true"></canvas>
  <header>
    <p class="site"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="{{ '/' | relative_url }}#projets">Projets</a></li>
        <li><a href="{{ '/' | relative_url }}#competences">Compétences</a></li>
        <li><a href="{{ '/mentions-legales/' | relative_url }}">Mentions légales</a></li>
      </ul>
    </nav>
  </header>

  <main>
{{ content }}
  </main>

  <footer>
    <p>{% if site.email != "" %}<a href="mailto:{{ site.email }}">{{ site.email }}</a> · {% endif %}{% if site.linkedin != "" %}<a href="{{ site.linkedin }}">LinkedIn</a> · {% endif %}contenu sous licence <a href="https://creativecommons.org/licenses/by/4.0/deed.fr">CC BY 4.0</a> · <a href="{{ '/mentions-legales/' | relative_url }}">mentions légales</a></p>
  </footer>
<script>
(() => {
  const canvas = document.getElementById('reseau');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let points = [], stars = [], w = 0, h = 0, raf;
  const rings = [
    { r: 150, speed: .00022, phase: 0 },
    { r: 290, speed: -.00014, phase: 1.7 },
    { r: 460, speed: .00008, phase: 3.2 }
  ];

  function resize() {
    w = innerWidth;
    h = innerHeight;
    canvas.width = w * devicePixelRatio;
    canvas.height = h * devicePixelRatio;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    const starCount = Math.min(190, Math.max(90, Math.floor(w * h / 9000)));
    stars = Array.from({length: starCount}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() < .88 ? Math.random() * 1.15 + .25 : Math.random() * 1.8 + .8,
      a: Math.random() * .55 + .18,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * .0018 + .0005
    }));

    const n = Math.min(62, Math.max(28, Math.floor(w / 26)));
    points = Array.from({length:n}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18
    }));
  }

  function haloRing(time) {
    // Giant Halo-like ring kept to the side, inspired by the supplied references.
    const cx = w * .91;
    const cy = h * .52;
    const rx = Math.max(390, w * .58);
    const ry = Math.max(115, h * .30);
    const rot = -0.23;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    // Soft atmospheric glow.
    ctx.shadowBlur = 34;
    ctx.shadowColor = 'rgba(67, 210, 255, .28)';
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(78, 205, 255, .16)';
    ctx.lineWidth = 18;
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(190, 241, 255, .34)';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(0, 0, rx - 13, ry - 7, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(45, 157, 205, .23)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Broken sections give it a distant sci-fi megastructure feel.
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(110, 225, 255, .34)';
    const pulse = reduce ? 0 : Math.sin(time * .00035) * .08;
    for (let i = 0; i < 9; i++) {
      const start = i * (Math.PI * 2 / 9) + .06;
      const gap = .035 + pulse;
      ctx.beginPath();
      ctx.arc(0, 0, rx, start, start + Math.PI * 2 / 9 - gap);
      ctx.stroke();
    }

    // Tiny navigation lights on the ring.
    if (!reduce) {
      for (let i = 0; i < 16; i++) {
        const a = time * .00018 + i * Math.PI * 2 / 16;
        const x = Math.cos(a) * rx;
        const y = Math.sin(a) * ry;
        ctx.beginPath();
        ctx.arc(x, y, 1.8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(157, 239, 255, .8)';
        ctx.shadowBlur = 9;
        ctx.shadowColor = 'rgba(77, 220, 255, .9)';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Energy projector mounted on the ring, firing a blue beam toward space.
    const beamA = -1.02;
    const sx = Math.cos(beamA) * rx;
    const sy = Math.sin(beamA) * ry;
    const beamPulse = reduce ? .72 : .62 + Math.sin(time * .004) * .10;

    // Wide atmospheric glow.
    const beamGrad = ctx.createLinearGradient(sx, sy, sx - 230, sy + 520);
    beamGrad.addColorStop(0, 'rgba(74, 218, 255, ' + (.30 * beamPulse) + ')');
    beamGrad.addColorStop(.35, 'rgba(44, 175, 255, ' + (.13 * beamPulse) + ')');
    beamGrad.addColorStop(1, 'rgba(20, 105, 190, 0)');
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(sx - 8, sy + 2);
    ctx.lineTo(sx - 250, sy + 545);
    ctx.lineTo(sx + 10, sy + 405);
    ctx.closePath();
    ctx.fill();

    // Focused core of the beam.
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(71, 211, 255, .85)';
    ctx.strokeStyle = 'rgba(173, 244, 255, ' + (.76 * beamPulse) + ')';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - 185, sy + 430);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Mechanical emitter attached to the ring.
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(beamA + Math.PI / 2);
    ctx.fillStyle = 'rgba(9, 31, 48, .96)';
    ctx.strokeStyle = 'rgba(116, 224, 255, .75)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-10, -7);
    ctx.lineTo(12, -7);
    ctx.lineTo(17, 0);
    ctx.lineTo(12, 7);
    ctx.lineTo(-10, 7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(88, 225, 255, .95)';
    ctx.shadowBlur = 14;
    ctx.shadowColor = 'rgba(70, 210, 255, .9)';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    ctx.restore();
  }

  function draw(time = 0) {
    ctx.clearRect(0,0,w,h);

    // Deep-space star field.
    for (const s of stars) {
      const twinkle = reduce ? 1 : .72 + Math.sin(time * s.speed + s.phase) * .28;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(225, 246, 255,' + (s.a * twinkle) + ')';
      ctx.fill();
    }

    haloRing(time);

    // Subtle network layer over the star field.
    for (const p of points) {
      if (!reduce) { p.x += p.vx; p.y += p.vy; }
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,1.15,0,Math.PI*2);
      ctx.fillStyle='rgba(125,211,252,.38)';
      ctx.fill();
    }

    for (let i=0;i<points.length;i++) for(let j=i+1;j<points.length;j++) {
      const a=points[i],b=points[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
      if(d<110) {
        ctx.strokeStyle='rgba(56,189,248,'+(0.055*(1-d/110))+')';
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }

    if (!reduce) raf=requestAnimationFrame(draw);
  }

  addEventListener('resize', resize);
  resize();
  draw();
})();
</script></body>
</html>
